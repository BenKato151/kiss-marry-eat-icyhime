<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiss-Marry-Eat - Icyhime Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <p id="character-counter"></p>
        <div id="loader" class="loader"></div>
        <div class="card">

            <!-- Placeholder for the character image -->
            <div id="drag-container">
                <img 
                  id="character-image" 
                  src="" 
                  alt="figure"
                  draggable="false"
                  onerror="this.src='https://freesvg.org/storage/img/thumb/errname1.png'; this.onerror=null;">
                <h2 id="character-name">Lade...</h2>
            </div>
            <!-- Placeholder for the character image -->

        </div>

        <!-- Buttons for Kiss Marry Eat -->
        <div class="buttons">
            <!-- TODO: Replace buttons for Kiss, Marry, Eat, back -->
            <button id="back-btn" onclick="goBack()">Zurück</button>
            <button id="pass-btn">Pass 👎</button>
            <button id="smash-btn">Smash 👍</button>
        </div>
        <!-- Buttons for Kiss Marry Eat -->

        <!-- History and result display -->
        <p id="result">
            <span class="result-label">Vorherige Auswahl:</span>
            <span id="result-text"></span>
        </p>
        <!-- History and result display -->

        <!-- Download button -->
        <button id="download-btn" style="display: none;">Downloade den Verlauf als CSV</button>
        <!-- Download button -->
        <div id="overview-grid"></div>
    </div>

    <script src="characters.js"></script>
    <script src="script.js"></script>

    <div class="footer">
        <a href="https://github.com/Framerr/smash-or-pass-template">Template</a> created by <a href="https://github.com/Framerr" target="_blank">Framerr</a>
        <br>
        <a href="https://github.com/BenKato151/kiss-marry-eat-icyhime">Template</a> rewritten by <a href="https://github.com/BenKato151/">BenKato_</a> and <a href="https://twitch.tv/icyhime">Icyhime</a>
    </div>
</body>
</html>
